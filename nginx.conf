user cloudron;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    access_log /dev/stdout;

    client_body_temp_path /run/nginx/client_body_temp;
    proxy_temp_path /run/nginx/proxy_temp;
    fastcgi_temp_path /run/nginx/fastcgi_temp;
    uwsgi_temp_path /run/nginx/uwsgi_temp;
    scgi_temp_path /run/nginx/scgi_temp;

    map $http_authorization $cognee_has_auth { "" 0; default 1; }
    map $http_cookie $cognee_has_cookie { "~auth_token=" 1; default 0; }
    map "$cognee_has_auth$cognee_has_cookie" $cognee_anonymous { "00" 1; default 0; }

    server {
        listen 8080;
        listen [::]:8080;

        client_max_body_size 512m;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        location = /api/v1/auth/register {
            return 403;
        }

        location ~ ^/(api/visualize|api/schema/inventory|api/schema/provenance|api/schema-provenance)$ {
            if ($cognee_anonymous) { return 401; }
            proxy_pass http://127.0.0.1:3000;
        }

        location ~ ^/api/v[0-9]+/ {
            proxy_pass http://127.0.0.1:8000;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8000;
        }

        location = /docs {
            proxy_pass http://127.0.0.1:8000;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:8000;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
