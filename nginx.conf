user cloudron;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    map $http_authorization $cognee_has_auth { "" 0; default 1; }
    map $http_cookie $cognee_has_cookie { "~auth_token=" 1; default 0; }
    map "$cognee_has_auth$cognee_has_cookie" $cognee_anonymous { "00" 1; default 0; }
    map $http_x_forwarded_proto $cognee_proto { "" $scheme; default $http_x_forwarded_proto; }

    server {
        listen 8080;
        listen [::]:8080;

        client_max_body_size 512m;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cognee_proto;

        location = /api/v1/auth/register {
            return 403;
        }

        location = /api/visualize {
            if ($cognee_anonymous) { return 401; }
            proxy_pass http://127.0.0.1:3000;
        }
        location = /api/schema/inventory {
            if ($cognee_anonymous) { return 401; }
            proxy_pass http://127.0.0.1:3000;
        }
        location = /api/schema/provenance {
            if ($cognee_anonymous) { return 401; }
            proxy_pass http://127.0.0.1:3000;
        }
        location = /api/schema-provenance {
            if ($cognee_anonymous) { return 401; }
            proxy_pass http://127.0.0.1:3000;
        }

        location ~ ^/api/v[0-9]+/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /docs {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
